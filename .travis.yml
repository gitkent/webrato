language: java
install: true
service:
  - docker

jdk:
  - openjdk11

before_cache:
  - rm -f  $HOME/.gradle/caches/modules-2/modules-2.lock
  - rm -fr $HOME/.gradle/caches/*/plugin-resolution/

cache:
  directories:
    - $HOME/.gradle/caches/
    - $HOME/.gradle/wrapper/

jobs:
  include:
    - stage: test
      script: ./gradlew build --scan -s
    - stage: build_image
      script: docker build -t webrato .
    - stage: push_image
      script: echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin && docker push kentio/webrato:latest
      
stages:
  - test
  - build_image
  - push_image
